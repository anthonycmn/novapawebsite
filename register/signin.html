<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — NOVAPA Registration</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<script src="/register/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --navy0:#08111F; --navy1:#0F1E36; --gold:#C8892A; --gold2:#E8B84B; --gold3:#F7D98F;
    --ink:rgba(255,255,255,0.88); --ink-dim:rgba(255,255,255,0.62);
    --line:rgba(255,255,255,0.14); --card:rgba(22,43,82,0.45); --danger:#E8654B;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:'DM Sans',sans-serif; color:var(--ink);
    background:radial-gradient(1200px 700px at 70% -10%, #1b3563 0%, var(--navy1) 45%, var(--navy0) 100%);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card {
    width:100%; max-width:440px; background:var(--card); border:1px solid var(--line);
    border-radius:16px; padding:34px 30px; text-align:center;
  }
  .brand {
    font-family:'Cinzel',serif; font-weight:700; letter-spacing:0.18em; font-size:12px;
    color:var(--gold2); margin-bottom:20px;
  }
  h1 {
    font-family:'Cormorant Garamond',serif; font-weight:700; font-size:30px; line-height:1.2;
    color:#fff; margin-bottom:10px;
  }
  h1 em { font-style:italic; color:var(--gold3); }
  p { color:var(--ink-dim); font-size:15px; line-height:1.6; }
  p + p { margin-top:12px; }
  button {
    width:100%; margin-top:22px; padding:15px 20px; border:0; border-radius:12px;
    background:linear-gradient(180deg, var(--gold2), var(--gold));
    color:#1a1206; font-family:inherit; font-weight:700; font-size:16px; cursor:pointer;
  }
  button:disabled { opacity:0.6; cursor:default; }
  button:focus-visible { outline:2px solid var(--gold3); outline-offset:3px; }
  .tiny { font-size:13px; color:var(--ink-dim); margin-top:16px; }
  .err {
    display:none; margin-top:18px; padding:14px 16px; border-radius:10px; text-align:left;
    border:1px solid rgba(232,101,75,0.45); background:rgba(232,101,75,0.10);
    color:var(--ink); font-size:14.5px; line-height:1.6;
  }
  .err.on { display:block; }
  .err b { color:#fff; }
  a { color:var(--gold2); }
  #codeBox { margin-top:22px; padding-top:18px; border-top:1px solid var(--line); text-align:left; }
  .codelead { font-size:13px; color:var(--ink-dim); line-height:1.6; margin-bottom:10px; }
  .coderow { display:flex; gap:8px; }
  .coderow input {
    flex:1; min-width:0; padding:13px 14px; border-radius:10px; border:1px solid var(--line);
    background:rgba(8,17,31,0.6); color:#fff; font-family:inherit; font-size:19px;
    letter-spacing:0.22em; text-align:center;
  }
  .coderow input:focus { outline:2px solid var(--gold2); outline-offset:1px; }
  .coderow button.alt {
    width:auto; margin-top:0; padding:13px 20px; font-size:15px; white-space:nowrap;
  }
  .codeerr { display:none; margin-top:9px; font-size:13px; color:var(--danger); }
  .codeerr.on { display:block; }
</style>
</head>
<body>

<div class="card">
  <div class="brand">NOVAPA REGISTRATION</div>

  <div id="working">
    <h1>Signing you <em>in…</em></h1>
    <p>One moment — taking you to your registration.</p>
  </div>

  <div id="ask" style="display:none">
    <h1>Almost <em>in.</em></h1>
    <p>Tap below to finish signing in and pick up where you left off.</p>
    <button id="go">Sign in to NOVAPA</button>
  </div>

  <div class="err" id="err"></div>

  <!-- Belt and braces for anyone whose employer scans links hard enough to
       spend them. A code can't be consumed by a scanner: there's nothing to
       fetch. Always available, never in the way. -->
  <div id="codeBox">
    <div class="codelead">Trouble with the link? Enter the code from the same email.</div>
    <div class="coderow">
      <input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="12" placeholder="code from your email">
      <button id="otpGo" class="alt">Sign in</button>
    </div>
    <div class="codeerr" id="otpErr"></div>
  </div>
</div>

<script>
(function(){
  var C = window.NOVAREG;
  var sb = window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY);
  var q = new URLSearchParams(location.search);
  var tokenHash = q.get('token_hash');
  // Supabase mints magic links as type=magiclink and brand-new signups as
  // type=signup. Verifying with the wrong type fails, so the template passes
  // it through and we only fall back when it's missing.
  var type = q.get('type') || 'magiclink';

  // The old template handed Supabase a redirect_to carrying the parent's
  // original query — their chosen show, their utm tags. Keep that working by
  // letting the template pass it as `next`. Taken as a raw substring because
  // the value has its own &-separated params, and only honoured when it points
  // back at us, so this can never become an open redirect.
  var next = (function(){
    var m = location.search.match(/[?&]next=(.*)$/);
    if (!m) return null;
    var raw = m[1];
    try { if (/%3A|%2F/i.test(raw)) raw = decodeURIComponent(raw); } catch(e){}
    var path = null;
    if (raw.indexOf('/') === 0 && raw.indexOf('//') !== 0) path = raw;
    else {
      try {
        var u = new URL(raw);
        if (u.origin === location.origin) path = u.pathname + u.search + u.hash;
      } catch(e){}
    }
    // Supabase falls back to the project Site URL when the caller passes no
    // redirect, which is the bare origin — following that would drop a parent
    // on the homepage after they clicked a *registration* sign-in link. Treat a
    // pathless destination as no destination.
    if (!path || path === '/' || path.indexOf('/?') === 0 || path.indexOf('/#') === 0) return null;
    return path;
  })();

  function fail(html){
    document.getElementById('ask').style.display = 'none';
    document.getElementById('working').style.display = 'none';
    var e = document.getElementById('err');
    e.innerHTML = html;
    e.classList.add('on');
  }

  // Where to land afterwards: whatever the link asked for, else the checkout
  // they started, else the front of the flow.
  function destination(){
    if (next) { try { localStorage.removeItem('nv_reg_intent'); } catch(e){} return next; }
    try {
      var intent = JSON.parse(localStorage.getItem('nv_reg_intent') || 'null');
      if (intent && intent.s && Date.now() - intent.t < 6 * 3600 * 1000) {
        localStorage.removeItem('nv_reg_intent');
        return '/register/' + intent.s;
      }
    } catch(e){}
    return '/register/?go=1';
  }

  var emailHint = q.get('email') || '';

  if (!tokenHash) {
    fail('<b>This link is missing its sign-in code.</b><br>Head back to ' +
         '<a href="/register/?go=1">the registration page</a> and request a new one.');
    return;
  }

  // Verifying on page load is NOT safe. Joyce Koons' mail scanner renders the
  // page and runs its JavaScript — on 2026-07-28 it produced four sessions in
  // fifteen minutes, one from a Microsoft Azure address on Windows 7 — so an
  // automatic verify handed the token straight to the scanner and the parent
  // got "expired" seconds later.
  //
  // So we wait for a signal only a person produces: a pointer move, a touch, a
  // scroll, a key. Real visitors emit one within a moment of the page appearing
  // and never see a button; the screen reads "Signing you in…" and moves on. A
  // scanner that renders but doesn't drive input emits none, and the token
  // survives for the real click.
  //
  // The typed code below is the guaranteed path if even that is beaten:
  // it is the same one-time token, but there is no URL for anything to fetch.
  var fired = false;
  var HUMAN = ['pointermove','pointerdown','touchstart','keydown','wheel','scroll'];
  var automated = false;
  try {
    automated = navigator.webdriver === true || !window.screen || window.screen.width === 0;
  } catch (e) {}

  function verify(){
    if (fired) return;
    fired = true;
    document.getElementById('ask').style.display = 'none';
    document.getElementById('working').style.display = 'block';

    sb.auth.verifyOtp({ token_hash: tokenHash, type: type }).then(function(res){
      if (res.error) {
        var m = (res.error.message || '').toLowerCase();
        if (m.indexOf('expired') !== -1 || m.indexOf('invalid') !== -1) {
          fail('<b>That sign-in link has expired.</b><br>They\'re only good for a short time. ' +
               '<a href="/register/?go=1">Request a new one</a> and it\'ll work.');
        } else {
          fail('<b>We couldn\'t sign you in.</b><br>' + (res.error.message || 'Please try again.') +
               '<br><br><a href="/register/?go=1">Request a new link</a> or reply to the email we sent you ' +
               'and we\'ll get you registered directly.');
        }
        return;
      }
      location.replace(destination());
    }).catch(function(){
      fail('<b>Something went wrong on our end.</b><br>' +
           '<a href="/register/?go=1">Try again</a>, or just reply to our email and we\'ll register you directly.');
    });
  }

  function armed(){
    HUMAN.forEach(function(e){ window.removeEventListener(e, onHuman, true); });
  }
  function onHuman(){ armed(); verify(); }

  document.getElementById('go').addEventListener('click', function(){ armed(); verify(); });

  if (!automated) HUMAN.forEach(function(e){ window.addEventListener(e, onHuman, true); });

  // No sign of a person: show the button rather than sit on a spinner. The
  // scanner reaches this state too, and a button is exactly what it won't press.
  setTimeout(function(){
    if (fired) return;
    document.getElementById('working').style.display = 'none';
    document.getElementById('ask').style.display = 'block';
  }, automated ? 0 : 2500);

  // ---- typed code: the path nothing can pre-consume ----
  var otp = document.getElementById('otp');
  var otpErr = document.getElementById('otpErr');
  function codeFail(msg){ otpErr.textContent = msg; otpErr.classList.add('on'); }

  function submitCode(){
    var token = (otp.value || '').replace(/\D/g, '');
    otpErr.classList.remove('on');
    // Supabase's OTP length is a project setting — this one issues 8 digits,
    // not the 6 the docs default to. Accept the range rather than a magic number.
    if (token.length < 6 || token.length > 12) return codeFail('Enter the code exactly as it appears in the email.');
    var email = emailHint || (prompt('What email address did we send it to?') || '').trim();
    if (!email) return codeFail('We need the email address the code was sent to.');
    document.getElementById('otpGo').disabled = true;
    sb.auth.verifyOtp({ email: email.toLowerCase(), token: token, type: 'email' }).then(function(res){
      document.getElementById('otpGo').disabled = false;
      if (res.error) {
        emailHint = '';   // the address may have been the wrong guess — ask again
        return codeFail(/expired|invalid/i.test(res.error.message || '')
          ? 'That code has expired or does not match. Request a new one and try again.'
          : (res.error.message || 'That did not work.'));
      }
      fired = true;
      location.replace(destination());
    }).catch(function(){
      document.getElementById('otpGo').disabled = false;
      codeFail('Something went wrong — try again, or reply to our email and we will register you directly.');
    });
  }
  document.getElementById('otpGo').addEventListener('click', submitCode);
  otp.addEventListener('keydown', function(e){ if (e.key === 'Enter') submitCode(); });
})();
</script>

</body>
</html>
