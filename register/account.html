<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My NOVAPA</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<script src="/register/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --navy0:#08111F; --navy1:#0F1E36; --gold:#C8892A; --gold2:#E8B84B; --gold3:#E8B84B;
    --ink:rgba(255,255,255,0.88); --ink-dim:rgba(255,255,255,0.62);
    --line:rgba(255,255,255,0.14); --card:rgba(22,43,82,0.45); --danger:#E8654B;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:'DM Sans',sans-serif; color:var(--ink);
    background:radial-gradient(1200px 700px at 70% -10%, #1b3563 0%, var(--navy1) 45%, var(--navy0) 100%);
    min-height:100vh;
  }
  .wrap { max-width:560px; margin:0 auto; padding:34px 20px 60px; }

  /* ---- portal chrome -----------------------------------------------------
     The page used to be one narrow column of identical cards, which read as a
     list rather than a place. This gives it a header that says whose account
     it is, a row of at-a-glance numbers, and labelled sections so the eye can
     find "my registrations" separately from "my credits". */
  .wrap.portal { max-width:920px; }
  .phead {
    display:flex; align-items:flex-end; justify-content:space-between; gap:16px;
    padding-bottom:18px; margin-bottom:22px; border-bottom:1px solid var(--line);
  }
  .phead h1 { text-align:left; margin:0; font-size:34px; }
  .phead .who { font-size:13.5px; color:var(--ink-dim); margin-top:4px; }
  .phead .signout { margin:0; }
  .stats { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:26px; }
  .stat {
    flex:1 1 150px; background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:14px 16px;
  }
  .stat .n { font-family:'Cormorant Garamond',serif; font-size:28px; font-weight:700; color:var(--gold3); line-height:1.1; }
  .stat .l { font-size:11.5px; letter-spacing:0.09em; text-transform:uppercase; color:var(--ink-dim); margin-top:3px; }
  .section { margin-bottom:30px; }
  .secHead { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; }
  .section-label {
    font-size:11.5px; letter-spacing:0.13em; text-transform:uppercase;
    color:var(--ink-dim); margin-bottom:10px; padding-left:2px;
  }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; }
  .grid .card { margin-bottom:0; }

  /* credit + reward rows: name on its own line, action full width beneath, so
     nothing collides the way "Ava Smith [PICK YOUR DATES]" used to */
  .creditRow { padding:14px 0; border-top:1px solid var(--line); }
  .creditRow:first-of-type { border-top:0; padding-top:0; }
  .creditRow .kid { font-size:15.5px; color:#fff; font-weight:500; margin-bottom:8px; }
  .chips { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:12px; }
  .chip {
    font-size:12.5px; font-weight:600; padding:5px 11px; border-radius:999px;
    background:rgba(232,184,75,0.12); border:1px solid rgba(232,184,75,0.32); color:var(--gold2);
  }
  .chip.snow { background:rgba(120,180,255,0.12); border-color:rgba(120,180,255,0.34); color:#9CC7FF; }
  .act {
    display:block; width:100%; padding:11px 16px; border-radius:11px;
    border:1px solid rgba(232,184,75,0.5); background:transparent; color:var(--gold2);
    font-family:inherit; font-weight:700; font-size:13px; letter-spacing:0.06em; cursor:pointer;
  }
  .act:hover { background:rgba(232,184,75,0.1); }
  .act.solid { background:linear-gradient(180deg,var(--gold2),var(--gold)); color:#1a1206; border-color:transparent; }
  .act[disabled] { opacity:0.45; cursor:default; }
  .pickList { margin-top:12px; border-top:1px solid var(--line); padding-top:12px; }
  .pickList label {
    display:flex; gap:10px; align-items:center; padding:9px 10px; font-size:14px;
    cursor:pointer; border-radius:10px;
  }
  .pickList label:hover { background:rgba(255,255,255,0.04); }
  .pickList input { width:auto; margin:0; accent-color:var(--gold2); }
  .pickList .left { margin-left:auto; font-size:12px; color:var(--ink-dim); }
  @media (max-width:640px){ .phead { flex-direction:column; align-items:flex-start; gap:10px; } .phead h1 { font-size:28px; } }
  h1 {
    font-family:'Cormorant Garamond',serif; font-weight:700; font-size:32px;
    color:#fff; text-align:center; margin-bottom:6px;
  }
  h1 em { font-style:italic; color:var(--gold3); }
  .sub { text-align:center; color:var(--ink-dim); font-size:15px; margin-bottom:22px; }
  .card {
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:26px; margin-bottom:16px;
  }
  input {
    width:100%; padding:14px 16px; border-radius:12px; border:1px solid var(--line);
    background:rgba(8,17,31,0.6); color:#fff; font-family:inherit; font-size:16px;
    outline:none; margin-bottom:10px;
  }
  input:focus { border-color:var(--gold); }
  .btn {
    width:100%; margin-top:4px; padding:14px 20px; border:0; border-radius:12px;
    background:linear-gradient(180deg, var(--gold2), var(--gold));
    color:#1a1206; font-family:inherit; font-weight:700; font-size:16px; cursor:pointer;
  }
  .btn[disabled] { opacity:0.6; cursor:default; }
  .btn.google {
    background:#fff; color:#1f1f1f; display:flex; align-items:center; justify-content:center; gap:10px;
    margin-top:12px;
  }
  .minor { background:none; border:0; color:var(--ink-dim); font-size:13px; text-decoration:underline; cursor:pointer; display:block; margin:14px auto 0; font-family:inherit; }
  .err { color:var(--danger); font-size:13.5px; margin-top:10px; min-height:17px; }
  .ok { color:#5BC98C; font-size:13.5px; margin-top:10px; }
  .toggle { display:flex; justify-content:center; gap:8px; margin-bottom:18px; }
  .toggle button {
    background:var(--card); border:1px solid var(--line); border-radius:12px; color:var(--ink-dim);
    font-family:inherit; font-size:13.5px; font-weight:500; padding:8px 20px; cursor:pointer;
  }
  .toggle button.on { background:linear-gradient(180deg, var(--gold2), var(--gold)); color:#1a1206; border-color:transparent; font-weight:700; }
  .camper {
    font-family:'Cormorant Garamond',serif; font-weight:700; font-size:24px; color:var(--gold3);
    margin-bottom:12px;
  }
  .item { padding:13px 0; border-top:1px solid var(--line); }
  .item:first-of-type { border-top:0; padding-top:0; }
  .item b { display:block; font-size:15.5px; color:#fff; font-weight:500; }
  .item span { font-size:13.5px; color:var(--ink-dim); }
  .item.past { opacity:0.65; }
  .foot { text-align:center; font-size:13.5px; color:var(--ink-dim); margin-top:20px; line-height:1.7; }
  .foot a { color:var(--gold2); }
  .signout { background:none; border:0; color:var(--ink-dim); font-size:13px; width:auto; margin:14px auto 0; display:block; text-decoration:underline; cursor:pointer; padding:0; font-family:inherit; }
  .empty { text-align:center; color:var(--ink-dim); padding:10px 0; }

  /* real site header (copied from index.html canonical) */
  body { padding-top: 64px; }
/* ── UNIVERSAL NAV ── */
   .u-nav {
     position: fixed;
     top: 0;
     left: 0;
     right: 0;
     z-index: 9000;
     height: 68px;
     display: flex;
     align-items: center;
     justify-content: space-between;
     padding: 0 48px;
     background: rgba(10, 14, 26, 0.97);
     backdrop-filter: blur(12px);
     border-bottom: 1px solid rgba(255, 255, 255, 0.06);
     font-family: 'DM Sans', sans-serif;
     box-sizing: border-box
   }

   .u-nav-logo {
     display: flex;
     align-items: center;
     gap: 11px;
     text-decoration: none;
     flex-shrink: 0
   }

   .u-nav-mark {
     width: 44px;
     height: 44px;
     display: flex;
     align-items: center;
     justify-content: center;
     flex-shrink: 0;
   }

   .u-nav-mark img {
     width: 100%;
     height: 100%;
     object-fit: contain;
     display: block
   }

   .u-nav-mark svg {
     width: 20px;
     height: 20px;
     fill: #0A0E1A
   }

   .u-nav-wordmark {
     font-family: 'Cormorant Garamond', serif;
     font-size: 15px;
     font-weight: 600;
     color: #fff;
     line-height: 1.2;
     letter-spacing: 0.01em
   }

   .u-nav-wordmark span {
     display: block;
     font-size: 9px;
     font-weight: 400;
     color: rgba(255, 255, 255, 0.38);
     letter-spacing: 0.14em;
     font-family: 'DM Sans', sans-serif;
     text-transform: uppercase;
     margin-top: 1px
   }

   .u-nav-links {
     display: flex;
     align-items: center;
     gap: 2px
   }

   .u-nav-links a {
     font-size: 11px;
     color: rgba(255, 255, 255, 0.5);
     text-decoration: none;
     letter-spacing: 0.07em;
     text-transform: uppercase;
     font-weight: 500;
     padding: 7px 11px;
     border-radius: 4px;
     transition: color 0.2s;
     white-space: nowrap
   }

   .u-nav-links a:hover {
     color: #E8B84B
   }

   .u-nav-links a.u-active {
     color: #E8B84B
   }

   .u-nav-cta {
     background: rgba(232,184,75, 0.15) !important;
     border: 1px solid rgba(232,184,75, 0.35) !important;
     color: #E8B84B !important;
     border-radius: 12px !important;
     padding: 7px 16px !important
   }

   .u-nav-cta:hover {
     background: #C9922A !important;
     color: #0A0E1A !important;
     border-color: #C9922A !important
   }

   body {
     padding-top: 68px
   }

   /* ── Mobile menu toggle button (hidden on desktop) ── */
   .u-nav-toggle {
     display: none;
     background: transparent;
     border: 1px solid rgba(255,255,255,0.12);
     width: 40px;
     height: 40px;
     border-radius: 6px;
     cursor: pointer;
     padding: 0;
     align-items: center;
     justify-content: center;
     flex-shrink: 0;
     transition: background 0.2s, border-color 0.2s;
   }
   .u-nav-toggle:hover { background: rgba(255,255,255,0.04); border-color: rgba(232,184,75,0.4); }
   .u-nav-toggle svg { width: 18px; height: 18px; stroke: #E8B84B; }
   .u-nav-toggle .ico-close { display: none; }
   .u-nav-toggle.is-open .ico-open { display: none; }
   .u-nav-toggle.is-open .ico-close { display: block; }

   @media(max-width:900px) {
     .u-nav { padding: 0 20px; }

     /* Hide desktop CTA on mobile (it's in the slide-out menu instead) */
     .u-nav-links { gap: 0; }

     /* Show the hamburger button on mobile */
     .u-nav-toggle { display: inline-flex; }

     /* Convert the inline links into a slide-out panel */
     .u-nav-links {
       position: fixed;
       top: 68px;
       left: 0;
       right: 0;
       background: rgba(8, 17, 31, 0.985);
       backdrop-filter: blur(14px);
       -webkit-backdrop-filter: blur(14px);
       flex-direction: column;
       align-items: stretch;
       padding: 12px 16px 24px;
       border-bottom: 1px solid rgba(232,184,75,0.18);
       max-height: calc(100vh - 68px);
       overflow-y: auto;
       transform: translateY(-12px);
       opacity: 0;
       pointer-events: none;
       transition: transform 0.22s ease, opacity 0.22s ease;
       box-shadow: 0 12px 32px rgba(0,0,0,0.4);
     }
     .u-nav-links.is-open {
       transform: translateY(0);
       opacity: 1;
       pointer-events: auto;
     }
     .u-nav-links a {
       display: block;
       padding: 14px 16px !important;
       font-size: 13px !important;
       letter-spacing: 0.14em !important;
       color: rgba(255,255,255,0.7) !important;
       border-radius: 6px;
       border: none !important;
       background: transparent !important;
       white-space: normal;
     }
     .u-nav-links a:hover { background: rgba(232,184,75,0.06) !important; color: #E8B84B !important; }
     .u-nav-links a.u-active { color: #E8B84B !important; background: rgba(232,184,75,0.06) !important; }

     /* The CTA inside the mobile panel becomes a full-width pill */
     .u-nav-links .u-nav-cta {
       margin-top: 10px;
       text-align: center;
       padding: 14px 20px !important;
       background: #C9922A !important;
       color: #08111F !important;
       border: none !important;
       font-weight: 700 !important;
     }
     .u-nav-links .u-nav-cta:hover { background: #E8B84B !important; color: #08111F !important; }
   }
   body.has-u-nav { padding-top: 68px; }

   /* ── FOOTER ── */
   .site-footer {
     background: #08111F;
     border-top: 1px solid rgba(232,184,75, 0.18);
     padding: 64px 60px 0;
     font-family: 'DM Sans', sans-serif;
     position: relative;
     overflow: hidden;
     color: #fff;
   }
   .site-footer::before {
     content: '';
     position: absolute;
     bottom: 0;
     left: 0;
     right: 0;
     height: 300px;
     background: radial-gradient(ellipse at 50% 120%, rgba(200, 137, 42, 0.06) 0%, transparent 70%);
     pointer-events: none;
   }
   .footer-main {
     max-width: 1140px;
     margin: 0 auto 52px;
     display: grid;
     grid-template-columns: 1.6fr 1fr 1fr 1fr;
     gap: 52px;
   }
   .footer-brand-logo {
     display: flex;
     align-items: center;
     gap: 12px;
     text-decoration: none;
     margin-bottom: 18px;
   }
   .footer-brand-mark {
     width: 42px;
     height: 42px;
     background: linear-gradient(135deg, #C8892A, #E8B84B);
     border-radius: 10px;
     display: flex;
     align-items: center;
     justify-content: center;
     flex-shrink: 0;
   }
   .footer-brand-mark svg { width: 22px; height: 22px; fill: #08111F; }
   .footer-brand-name {
     font-family: 'Cinzel', serif;
     font-size: 11px;
     font-weight: 700;
     color: #fff;
     line-height: 1.35;
     letter-spacing: 0.04em;
   }
   .footer-brand-name span {
     display: block;
     font-size: 8.5px;
     font-weight: 400;
     color: #E8B84B;
     letter-spacing: 0.22em;
     font-family: 'DM Sans', sans-serif;
     margin-top: 2px;
   }
   .footer-tagline {
     font-size: 13px;
     font-weight: 300;
     color: rgba(255, 255, 255, 0.35);
     line-height: 1.75;
     margin-bottom: 28px;
     max-width: 280px;
   }
   .footer-contact-block { display: flex; flex-direction: column; gap: 11px; }
   .footer-contact-link {
     display: flex;
     align-items: center;
     gap: 10px;
     text-decoration: none;
     color: rgba(255, 255, 255, 0.45);
     font-size: 13px;
     transition: color 0.2s;
   }
   .footer-contact-link:hover { color: #E8B84B; }
   .footer-contact-link .fc-icon { font-size: 14px; width: 20px; text-align: center; flex-shrink: 0; }
   .footer-col-head {
     font-family: 'Cinzel', serif;
     font-size: 9px;
     font-weight: 700;
     letter-spacing: 0.25em;
     text-transform: uppercase;
     color: rgba(255, 255, 255, 0.2);
     margin-bottom: 18px;
     padding-bottom: 10px;
     border-bottom: 1px solid rgba(255, 255, 255, 0.06);
   }
   .footer-col a {
     display: flex;
     align-items: center;
     gap: 8px;
     font-size: 13px;
     color: rgba(255, 255, 255, 0.4);
     text-decoration: none;
     margin-bottom: 11px;
     font-weight: 300;
     transition: color 0.2s, padding-left 0.2s;
     line-height: 1.4;
   }
   .footer-col a::before {
     content: '\203A';
     color: #E8B84B;
     font-size: 16px;
     line-height: 1;
     opacity: 0;
     transition: opacity 0.2s;
     flex-shrink: 0;
   }
   .footer-col a:hover { color: #fff; padding-left: 4px; }
   .footer-col a:hover::before { opacity: 1; }
   .footer-col a[target="_blank"]::after {
     content: '\2197';
     font-size: 10px;
     color: rgba(232,184,75, 0.5);
     margin-left: auto;
   }
   .footer-divider {

   }
   .footer-bottom {
     max-width: 1140px;
     margin: 0 auto;
     padding: 24px 0 28px;
     display: flex;
     align-items: center;
     justify-content: space-between;
     flex-wrap: wrap;
     gap: 12px;
   }
   .footer-copy { font-size: 11.5px; color: rgba(255, 255, 255, 0.18); }
   .footer-copy strong { color: rgba(255, 255, 255, 0.3); font-weight: 500; }
   .footer-legal { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
   .footer-legal a {
     font-size: 11.5px;
     color: rgba(255, 255, 255, 0.25);
     text-decoration: none;
     transition: color 0.2s;
   }
   .footer-legal a:hover { color: #E8B84B; }
   @media(max-width:1024px) {
     .footer-main { grid-template-columns: 1fr 1fr; gap: 36px; }
     .site-footer { padding: 56px 40px 0; }
   }
   @media(max-width:680px) {
     .footer-main { grid-template-columns: 1fr; gap: 28px; }
     .site-footer { padding: 48px 24px 0; }
     .footer-bottom { flex-direction: column; align-items: flex-start; }
   }

   /* ── CURRENT SHOW BANNER ── */
   .current-show {
     position: relative;
     padding: 64px 24px 80px;
     background:
       radial-gradient(ellipse at top, rgba(139, 26, 47, 0.18), transparent 60%),
       radial-gradient(ellipse at bottom right, rgba(200, 137, 42, 0.12), transparent 60%),
       linear-gradient(180deg, var(--navy) 0%, var(--navy2) 100%);
     overflow: hidden;
   }
   .current-show::before {
     content: '';
     position: absolute;
     top: 0; left: 0; right: 0;
     height: 1px;
     background: linear-gradient(90deg, transparent, rgba(200, 137, 42, 0.5), transparent);
   }
   .current-show::after {
     content: '';
     position: absolute;
     bottom: 0; left: 0; right: 0;
     height: 1px;
     background: linear-gradient(90deg, transparent, rgba(200, 137, 42, 0.3), transparent);
   }
   .cs-wrap {
     max-width: 1320px;
     margin: 0 auto;
     display: grid;
     grid-template-columns: 1.15fr 1fr;
     gap: 56px;
     align-items: center;
   }
   .cs-poster {
     position: relative;
     border-radius: 18px;
     overflow: hidden;
     box-shadow: 0 30px 80px rgba(0,0,0,0.55), 0 0 0 1px rgba(232,184,75,0.25);
     transform: perspective(1200px) rotateY(-2deg);
     transition: transform 0.5s ease;
   }
   .cs-poster:hover { transform: perspective(1200px) rotateY(0deg) translateY(-4px); }
   .cs-poster img { display: block; width: 100%; height: auto; }
   .cs-poster-frame {
     position: absolute; inset: 0;
     border-radius: 18px;
     pointer-events: none;
     background: linear-gradient(135deg, rgba(232,184,75,0.15), transparent 35%, transparent 65%, rgba(139,26,47,0.18));
   }
   .cs-content { color: #fff; }
   .cs-tag {
     display: inline-flex;
     align-items: center;
     gap: 8px;
     padding: 7px 16px;
     background: linear-gradient(135deg, rgba(200,137,42,0.18), rgba(247,217,143,0.08));
     border: 1px solid rgba(232,184,75,0.4);
     border-radius: 8px;
     font-family: 'Cinzel', serif;
     font-size: 11px;
     letter-spacing: 3px;
     color: var(--gold3);
     text-transform: uppercase;
     margin-bottom: 22px;
   }
   .cs-tag .pulse {
     width: 8px; height: 8px;
     border-radius: 50%;
     background: var(--gold2);
     box-shadow: 0 0 0 0 rgba(232,184,75,0.7);
     animation: csPulse 2s infinite;
   }
   @keyframes csPulse {
     0% { box-shadow: 0 0 0 0 rgba(232,184,75,0.7); }
     70% { box-shadow: 0 0 0 12px rgba(232,184,75,0); }
     100% { box-shadow: 0 0 0 0 rgba(232,184,75,0); }
   }
   .cs-title {
     font-family: 'Playfair Display', serif;
     font-size: clamp(34px, 4.5vw, 56px);
     line-height: 1.05;
     font-weight: 600;
     margin: 0 0 14px;
     letter-spacing: -1px;
   }
   .cs-title em {
     font-style: italic;
     color: var(--gold3);
     font-weight: 400;
   }
   .cs-sub {
     font-family: 'Cormorant Garamond', serif;
     font-size: 19px;
     font-style: italic;
     color: rgba(255,255,255,0.75);
     margin: 0 0 28px;
     line-height: 1.5;
   }
   .cs-venue {
     display: flex;
     gap: 16px;
     align-items: flex-start;
     padding: 18px 20px;
     background: rgba(15, 30, 54, 0.55);
     border: 1px solid rgba(255,255,255,0.08);
     border-left: 3px solid var(--gold);
     border-radius: 10px;
     margin-bottom: 28px;
     backdrop-filter: blur(8px);
   }
   .cs-venue-icon {
     flex-shrink: 0;
     width: 22px;
     height: 22px;
     stroke: var(--gold2);
     fill: none;
     stroke-width: 2;
     stroke-linecap: round;
     stroke-linejoin: round;
     margin-top: 2px;
   }
   .cs-venue-text { font-size: 14px; line-height: 1.55; color: rgba(255,255,255,0.85); }
   .cs-venue-text strong {
     display: block;
     color: #fff;
     font-weight: 600;
     letter-spacing: 0.3px;
     margin-bottom: 3px;
   }
   .cs-cta {
     display: flex;
     gap: 14px;
     flex-wrap: wrap;
     align-items: center;
   }
   .cs-cta .btnp { padding: 18px 38px; font-size: 15px; }
   .cs-runs {
     font-family: 'Cinzel', serif;
     font-size: 11px;
     letter-spacing: 2px;
     color: rgba(232,184,75,0.7);
     text-transform: uppercase;
   }
   @media (max-width: 900px) {
     .cs-wrap { grid-template-columns: 1fr; gap: 36px; }
     .cs-poster { transform: none; max-width: 580px; margin: 0 auto; }
     .cs-poster:hover { transform: translateY(-4px); }
     .current-show { padding: 48px 20px 60px; }
   }
   @media (max-width: 520px) {
     .cs-venue { flex-direction: column; gap: 10px; padding: 16px; }
     .cs-cta { flex-direction: column; align-items: stretch; }
     .cs-cta .btnp { justify-content: center; }
     .cs-runs { text-align: center; }
   }
   /* Nav fit: keep all items (incl. Camp Newsletters) visible on standard laptops */
   .u-nav .u-nav-links { gap: 0; }
   .u-nav .u-nav-links a { padding: 7px 7px; letter-spacing: 0.04em; }

</style>
<link rel="stylesheet" href="/brand.css">
</head>
<body>
<script src="/nav.js"></script>

<div class="wrap" id="wrap">
  <div class="phead" id="phead" style="display:none">
    <div>
      <h1>My <em>NOVAPA</em></h1>
      <div class="who" id="subLine">Everything your family is registered for.</div>
    </div>
    <button class="signout" id="signoutTop" style="display:none">Sign out</button>
  </div>
  <h1 id="titleFallback">My <em>NOVAPA</em></h1>
  <p class="sub" id="subFallback">Everything your family is registered for.</p>
  <div class="stats" id="stats" style="display:none"></div>

  <!-- Login -->
  <div class="card" id="authCard" style="display:none">
    <input type="email" id="email" placeholder="Email address" autocomplete="email">
    <input type="password" id="password" placeholder="Password" autocomplete="current-password">
    <button class="btn" id="loginBtn">LOG IN</button>
    <button class="btn google" id="googleBtn">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.1 5.7l6.2 5.2C41.4 35.4 44 30.1 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
      Sign in with Google
    </button>
    <button class="minor" id="firstTimeBtn">First time here? Set up your password</button>
    <div class="err" id="authErr"></div>
    <div class="ok" id="authOk"></div>
  </div>

  <!-- Registrations -->
  <div class="toggle" id="toggle" style="display:none">
    <button id="tUpcoming" class="on">Upcoming</button>
    <button id="tPast">Past</button>
  </div>
  <div class="section"><div class="secHead" id="listLabel" style="display:none"><div class="section-label" style="margin:0">Registrations</div><div id="toggleSlot"></div></div><div id="list"></div></div>
  <div id="credits"></div>
  <div id="rewards"></div>

  <p class="foot" id="foot" style="display:none">
    Something missing or look wrong? Email <a href="mailto:info@novapa.org">info@novapa.org</a> and we'll fix it fast.
  </p>
  <button class="signout" id="signout" style="display:none">Sign out</button>
</div>

<script>
  var sb = window.supabase.createClient(window.NOVAREG.SUPABASE_URL, window.NOVAREG.SUPABASE_ANON_KEY);
  var $ = function(id){ return document.getElementById(id); };
  var DATA = null, VIEW = 'upcoming', AUTH_TOKEN = null, PORTAL_TOKEN = null;

  function esc(s){ var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

  function render() {
    if (!DATA) return;
    var past = VIEW === 'past';
    var cards = DATA.campers.map(function(c){
      var items = c.items.filter(function(it){ return !!it.past === past; });
      if (!items.length) return '';
      return '<div class="card"><div class="camper">' + esc(c.name) + '</div>' +
        items.map(function(it){
          return '<div class="item' + (past ? ' past' : '') + '"><b>' + esc(it.title) + '</b>' +
            (it.dates ? '<span>' + esc(it.dates) + '</span>' : '') + '</div>';
        }).join('') + '</div>';
    }).join('');
    // portal chrome: swap the centred title for the header bar, and show the
    // at-a-glance numbers once we actually have data to count
    $('wrap').className = 'wrap portal';
    $('phead').style.display = 'flex';
    $('titleFallback').style.display = 'none';
    $('subFallback').style.display = 'none';
    $('signoutTop').style.display = PORTAL_TOKEN ? 'none' : 'block';
    $('listLabel').style.display = 'flex';
    var slot = $('toggleSlot');
    if (slot && $('toggle').parentNode !== slot) slot.appendChild($('toggle'));
    $('toggle').style.marginBottom = '0';
    var upcoming = 0;
    DATA.campers.forEach(function(c){ c.items.forEach(function(it){ if (!it.past) upcoming++; }); });
    var dayCr = (DATA.credits || []).reduce(function(n, c){ return n + (c.day || 0); }, 0);
    var openRw = (DATA.rewards || []).filter(function(r){ return !r.redeemed_at; }).length;
    $('stats').style.display = 'flex';
    $('stats').innerHTML = [
      { n: DATA.campers.length, l: DATA.campers.length === 1 ? 'Performer' : 'Performers' },
      { n: upcoming, l: 'Upcoming' },
      dayCr ? { n: dayCr, l: 'Day camp credits' } : null,
      openRw ? { n: openRw, l: openRw === 1 ? 'Reward' : 'Rewards' } : null,
    ].filter(Boolean).map(function(s){
      return '<div class="stat"><div class="n">' + s.n + '</div><div class="l">' + s.l + '</div></div>';
    }).join('');
    if (cards) cards = '<div class="grid">' + cards + '</div>';
    $('list').innerHTML = cards ||
      '<div class="card"><div class="empty">' + (past ? 'No past programs yet.' : 'Nothing upcoming yet. Time to fix that!') + '</div></div>';
    renderCredits();
    renderRewards();
  }

  // ── referral tickets: earned by sharing your link (or by joining through
  // one). Redeemed in person — a parent taps REDEEM at the box office with
  // staff watching, and the ticket flips to used for everyone.
  function fmtDay(iso){
    var d = new Date(iso);
    return isNaN(d) ? '' : d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
  }
  // Day Camp Pack: a family buys 5 days up front and picks the dates here,
  // whenever they know their school calendar. Credits sit on the camper row.
  //
  // Picking dates deliberately hands off to the normal checkout with the days
  // preselected (?activity=id,id,...) rather than booking from this page.
  // priceCart already zeroes day-camp lines against a camper's credits, so the
  // order completes at $0 down the same path as every other registration and
  // this page never has to touch seats, holds or money.
  function renderCredits(){
    var cr = (DATA && DATA.credits) || [];
    var camps = (DATA && DATA.dayCamps) || [];
    if (!cr.length) { $('credits').innerHTML = ''; return; }

    $('credits').innerHTML =
      '<div class="section"><div class="section-label">Day Camp Pack</div><div class="card">' +
      cr.map(function(c, i){
        var chips = '';
        if (c.day) chips += '<span class="chip">' + c.day + ' day camp</span>';
        if (c.snow) chips += '<span class="chip snow">' + c.snow + ' snow day</span>';
        return '<div class="creditRow">' +
          '<div class="kid">' + esc(c.name) + '</div>' +
          '<div class="chips">' + chips + '</div>' +
          (c.day && camps.length
            ? '<button class="act pick-btn" data-kid="' + i + '">PICK YOUR DATES</button>' +
              '<div class="picker" data-for="' + i + '" style="display:none"></div>'
            : c.day
              ? '<span style="font-size:13px;color:var(--ink-dim)">Dates open soon. We will email you when the calendar is posted.</span>'
              : '') +
          '</div>';
      }).join('') +
      '<div class="empty" style="font-size:12px;margin-top:14px">Credits last the school year. Snow day credits are used automatically when we run a Snow Day Fun Day.</div>' +
      '</div></div>';

    $('credits').querySelectorAll('.pick-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var i = btn.getAttribute('data-kid');
        var kid = cr[i];
        var box = $('credits').querySelector('.picker[data-for="' + i + '"]');
        if (box.style.display === 'block') { box.style.display = 'none'; btn.textContent = 'PICK YOUR DATES'; return; }
        box.style.display = 'block'; btn.textContent = 'HIDE DATES';
        box.innerHTML = '<div class="pickList">' +
          '<div style="font-size:12.5px;color:var(--ink-dim);margin-bottom:6px">Choose up to <b>' + kid.day + '</b> day' + (kid.day === 1 ? '' : 's') + ' for ' + esc(kid.name) + '.</div>' +
          camps.map(function(a){
            return '<label><input type="checkbox" value="' + a.id + '">' +
              '<span>' + esc(a.when || a.name) + '</span>' +
              (a.remaining !== null && a.remaining < 10 ? '<span class="left">' + a.remaining + ' left</span>' : '') +
              '</label>';
          }).join('') +
          '<button class="act solid go-btn" style="margin-top:12px" disabled>SELECT DATES</button>' +
          '</div>';

        var boxes = box.querySelectorAll('input[type=checkbox]');
        var go = box.querySelector('.go-btn');
        function sync(){
          var picked = [].filter.call(boxes, function(b){ return b.checked; });
          // Never let them select more days than they hold credits for; the
          // extra would silently become a charge at checkout.
          boxes.forEach(function(b){ b.disabled = !b.checked && picked.length >= kid.day; });
          go.disabled = picked.length === 0;
          go.textContent = picked.length
            ? 'BOOK ' + picked.length + ' DAY' + (picked.length === 1 ? '' : 'S') + ' WITH CREDITS'
            : 'SELECT DATES';
        }
        boxes.forEach(function(b){ b.addEventListener('change', sync); });
        go.addEventListener('click', function(){
          var ids = [].filter.call(boxes, function(b){ return b.checked; }).map(function(b){ return b.value; });
          if (!ids.length) return;
          location.href = '/register/?activity=' + ids.join(',');
        });
      });
    });
  }

  function renderRewards(){
    var rws = (DATA && DATA.rewards) || [];
    if (!rws.length) { $('rewards').innerHTML = ''; return; }
    $('rewards').innerHTML =
      '<div class="section"><div class="section-label">Referral rewards</div><div class="card">' +
      rws.map(function(r){
        var why = r.side === 'referrer'
          ? 'For referring ' + esc(r.other_name)
          : 'Welcome gift, you joined through ' + esc(r.other_name) + "'s link";
        return '<div class="creditRow">' +
          '<div class="kid">2 tickets to any show</div>' +
          '<div style="font-size:13px;color:var(--ink-dim);margin-bottom:12px">' + why + '</div>' +
          (r.redeemed_at
            ? '<div style="color:#6BCB77;font-weight:600;font-size:13.5px">&#10003; Redeemed ' + fmtDay(r.redeemed_at) + '</div>'
            : '<a class="act solid" style="text-align:center;text-decoration:none" href="/tickets/">USE FOR SHOW TICKETS</a>' +
              '<button class="act redeem-btn" data-rw="' + esc(r.id) + '" style="margin-top:8px">REDEEM IN PERSON AT BOX OFFICE</button>') +
          '</div>';
      }).join('') +
      '<div class="empty" style="font-size:12px;margin-top:14px">Applied automatically at online checkout. One-time use.</div>' +
      '</div></div>';

    $('rewards').querySelectorAll('.redeem-btn').forEach(function(b){
      b.addEventListener('click', function(){
        if (!confirm('Redeem your 2 show tickets now?\n\nOnly tap this at the box office with a staff member watching - once redeemed it cannot be used again.')) return;
        b.disabled = true; b.textContent = 'REDEEMING…';
        fetch('/api/reg-account', {
          method: 'POST',
          headers: AUTH_TOKEN
            ? { 'Content-Type':'application/json', Authorization: 'Bearer ' + AUTH_TOKEN }
            : { 'Content-Type':'application/json' },
          body: JSON.stringify(PORTAL_TOKEN
            ? { action:'redeem_referral', reward_id: b.dataset.rw, portal_token: PORTAL_TOKEN }
            : { action:'redeem_referral', reward_id: b.dataset.rw })
        }).then(function(r){ return r.json(); }).then(function(d){
          if (d.error) { alert(d.error); b.disabled = false; b.textContent = 'REDEEM AT BOX OFFICE'; return; }
          load(AUTH_TOKEN, PORTAL_TOKEN);
        }).catch(function(){ b.disabled = false; b.textContent = 'REDEEM AT BOX OFFICE'; });
      });
    });
  }

  $('tUpcoming').onclick = function(){ VIEW = 'upcoming'; this.classList.add('on'); $('tPast').classList.remove('on'); render(); };
  $('tPast').onclick = function(){ VIEW = 'past'; this.classList.add('on'); $('tUpcoming').classList.remove('on'); render(); };

  function load(token, portalToken) {
    AUTH_TOKEN = token || null; PORTAL_TOKEN = portalToken || null;
    $('authCard').style.display = 'none';
    $('list').innerHTML = '<div class="card"><div class="empty">Loading your registrations…</div></div>';
    fetch('/api/reg-account', {
      method:'POST',
      headers: portalToken ? { 'Content-Type':'application/json' } : { Authorization: 'Bearer ' + token },
      body: portalToken ? JSON.stringify({ portal_token: portalToken }) : undefined
    })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d.error) { showAuth(d.error); return; }
        DATA = d;
        $('subLine').textContent = d.family.parent_name
          ? 'Everything registered under ' + d.family.parent_name + "'s account."
          : 'Everything registered under ' + d.family.email + '.';
        $('toggle').style.display = 'flex';
        render();
        $('foot').style.display = 'block';
        $('signout').style.display = portalToken ? 'none' : 'block';
      })
      .catch(function(){ showAuth('Network hiccup, try again.'); });
  }

  function showAuth(msg) {
    $('list').innerHTML = '';
    $('toggle').style.display = 'none';
    $('authCard').style.display = 'block';
    $('authErr').textContent = msg && msg !== 'sign in required' ? msg : '';
  }

  function validEmail(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }

  $('loginBtn').onclick = function(){
    var email = $('email').value.trim().toLowerCase(), pw = $('password').value;
    $('authOk').textContent = '';
    if (!validEmail(email)) { $('authErr').textContent = 'Enter a valid email.'; return; }
    if (!pw) { $('authErr').textContent = 'Enter your password, or use "First time here" below.'; return; }
    var b = this; b.disabled = true; b.textContent = 'LOGGING IN…';
    sb.auth.signInWithPassword({ email: email, password: pw }).then(function(res){
      b.disabled = false; b.textContent = 'LOG IN';
      if (res.error) { $('authErr').textContent = 'That login didn\'t work. If you haven\'t set a password yet, use "First time here" below.'; return; }
      load(res.data.session.access_token);
    });
  };

  // First-time password setup: brand-new emails get an account immediately;
  // families who already exist (OTP-era accounts) get a set-password email.
  $('firstTimeBtn').onclick = function(){
    var email = $('email').value.trim().toLowerCase(), pw = $('password').value;
    $('authOk').textContent = ''; $('authErr').textContent = '';
    if (!validEmail(email)) { $('authErr').textContent = 'Enter your email above first.'; return; }
    if (!pw || pw.length < 8) { $('authErr').textContent = 'Type the password you want (8+ characters) above, then tap this again.'; return; }
    var b = this; b.disabled = true;
    sb.auth.signUp({ email: email, password: pw }).then(function(res){
      if (!res.error && res.data.session) { b.disabled = false; load(res.data.session.access_token); return; }
      // Existing account (or confirmation required): fall back to an emailed
      // set-password link that lands back here.
      sb.auth.resetPasswordForEmail(email, {
        redirectTo: location.origin + '/register/signin.html?next=' + encodeURIComponent('/register/account.html')
      }).then(function(r2){
        b.disabled = false;
        if (r2.error) { $('authErr').textContent = r2.error.message; return; }
        $('authOk').textContent = 'Check your email! Follow the link there once and your password will be active.';
      });
    });
  };

  $('googleBtn').onclick = function(){
    sb.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: location.origin + '/register/account.html' }
    }).then(function(res){
      if (res.error) $('authErr').textContent = 'Google sign-in isn\'t enabled yet.';
    });
  };

  $('signoutTop').onclick = function(){ sb.auth.signOut().then(function(){ location.reload(); }); };
  $('signout').onclick = function(){
    sb.auth.signOut().then(function(){ location.reload(); });
  };

  var portalToken = new URLSearchParams(location.search).get('t');
  if (portalToken) {
    load(null, portalToken);
  } else {
    sb.auth.getSession().then(function(res){
      var s = res.data && res.data.session;
      if (s) load(s.access_token); else showAuth();
    });
  }
</script>

</body>
</html>
