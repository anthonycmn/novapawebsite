# Netlify configuration for the NOVAPA website (static HTML site).
# The site files live in the repository root and need no build step, so the
# publish directory is "." and the "build" is only our pre-deploy checks.
#
# The command is the deploy gate: a non-zero exit fails the build and the new
# version never goes live. It exists because on Aug 13 2026 an undeclared
# identifier shipped to production and silently killed every fall-show
# registration for four hours while 554 campaign emails pointed families at
# that page. The page still returned 200 the whole time, so nothing short of
# parsing the code would have caught it. See tests/preflight.mjs.

[build]
  publish = "."
  command = "npm run check"
  # Skip the build entirely when a push changed nothing that reaches the built
  # site. A push touching only markdown or docs/ still costs 15 credits without
  # this, and nothing it changed can affect what visitors see. Site files live
  # in the repo root, so the exclude list is deliberately short — LAUNCH-
  # CHECKLIST.md and docs/ are the only non-shipping paths here, and no HTML
  # references a .md file. Anything else still builds and still runs preflight.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)*.md' ':(exclude)docs/'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ---------------------------------------------------------------------------
# Domain move (Aug 14 2026): novapa.org is the primary domain. Netlify only
# auto-redirects the primary's own www counterpart; other custom domains are
# ALIASES, which serve content rather than redirect. These host-based rules
# make every old URL 301 to novapa.org with path and query preserved, so
# campaign links (utm_*, pe=) keep attributing. Jason: "we can't have any of
# those old urls be stale."

[[redirects]]
  from = "https://www.northernvirginiaperformingarts.org/*"
  to = "https://novapa.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://northernvirginiaperformingarts.org/*"
  to = "https://novapa.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.novapa.org/*"
  to = "https://novapa.org/:splat"
  status = 301
  force = true

# Old Summer 2026 camp page is retired — send stale links/bookmarks to the
# current summer funnel.
[[redirects]]
  from = "/summer"
  to = "/summer-2027"
  status = 301
  force = true

# Ad landing page for the Frozen fall production — clean URL for Meta ads.
[[redirects]]
  from = "/frozen-checkout"
  to = "/frozen-checkout.html"
  status = 200

[[redirects]]
  from = "/be-in-frozen"
  to = "/be-in-frozen.html"
  status = 200

# Printed on the back of playbills — short, typeable, and tagged so we can
# see exactly how many registrations the print piece drives.
[[redirects]]
  from = "/frozen"
  to = "/register/?season=fall&utm_source=playbill&utm_medium=print&utm_campaign=frozen-playbill"
  status = 302
  force = true

[[redirects]]
  from = "/summer.html"
  to = "/summer-2027.html"
  status = 301
  force = true

# 2026 Camp Parent Info is retired from public navigation. Old links and
# bookmarks go to the current summer camp page. The original page is kept
# for staff/webmaster reference at /camp-info-2026-archive.html, which is
# intentionally NOT redirected.
[[redirects]]
  from = "/camp-info"
  to = "/summer-2027.html"
  status = 301
  force = true

[[redirects]]
  from = "/camp-info.html"
  to = "/summer-2027.html"
  status = 301
  force = true

# Shrek Jr. closed in July 2026 and its page is gone. Old links, shared
# posts, and search results go to the current season rather than a 404.
[[redirects]]
  from = "/shrek"
  to = "/index.html#shows"
  status = 301
  force = true

[[redirects]]
  from = "/shrek.html"
  to = "/index.html#shows"
  status = 301
  force = true

# Every Sawyer and Regpack embed is gone (Jul 31 2026) — registration,
# coaching, and auditions all run through our own system now. These pages
# are deleted but still indexed (Todd's Jul 30 audit), so send them to the
# real checkout rather than letting them 404.
#
# /coaching-registration was the Regpack coaching form.
[[redirects]]
  from = "/coaching-registration"
  to = "/register/?coaching"
  status = 301
  force = true

[[redirects]]
  from = "/coaching-registration.html"
  to = "/register/?coaching"
  status = 301
  force = true

# /novapa_registration was the Sawyer schedule embed.
[[redirects]]
  from = "/novapa_registration"
  to = "/register/"
  status = 301
  force = true

[[redirects]]
  from = "/novapa_registration.html"
  to = "/register/"
  status = 301
  force = true

# The Teen Conservatory audition page advertised in-person auditions on
# June 13 & 14 2026 in the present tense — "sign up for your time slot",
# "submit a video by June 14". Those dates are two months gone and the
# season's casts are set. Nothing on the site linked to it, but it stayed
# live and indexable, so a family searching "novapa auditions" landed on a
# call that had already closed. Send them to the programme page instead.
# The file itself is kept, unlinked, as the template for next season's
# audition call (CJ, 9 Aug 2026).
[[redirects]]
  from = "/teen_conservatory_auditions"
  to = "/teen-conservatory.html"
  status = 301
  force = true

[[redirects]]
  from = "/teen_conservatory_auditions.html"
  to = "/teen-conservatory.html"
  status = 301
  force = true

# Clean URL for the team page — short enough to say out loud and to print.
[[redirects]]
  from = "/team"
  to = "/meet-the-team.html"
  status = 200

[[redirects]]
  from = "/meet-the-team"
  to = "/meet-the-team.html"
  status = 200

# faculty.html was the earlier team page: one bio and a "more of our team,
# coming shortly" placeholder. meet-the-team.html supersedes it with the
# whole roster, and Tony's credentials carry over inside his bio. Nothing
# on the site ever linked to faculty.html — the sweep had flagged it as an
# orphan for weeks — but it stayed live and indexable, so a family
# searching "novapa staff" could land on the thinner page. The file is
# kept, unlinked, for its screening-and-training block, which is also on
# safety.html (CJ, 5 Sep 2026).
[[redirects]]
  from = "/faculty"
  to = "/meet-the-team.html"
  status = 301
  force = true

[[redirects]]
  from = "/faculty.html"
  to = "/meet-the-team.html"
  status = 301
  force = true
