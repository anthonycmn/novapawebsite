# Netlify configuration for the NOVAPA website (static HTML site).
# The site files live in the repository root and need no build step,
# so there is no build command and the publish directory is ".".

[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Old Summer 2026 camp page is retired — send stale links/bookmarks to the
# current summer funnel.
[[redirects]]
  from = "/summer"
  to = "/summer-2027"
  status = 301
  force = true

[[redirects]]
  from = "/summer.html"
  to = "/summer-2027.html"
  status = 301
  force = true

# 2026 Camp Parent Info is retired from public navigation. Old links and
# bookmarks go to the current summer camp page. The original page is kept
# for staff/webmaster reference at /camp-info-2026-archive.html, which is
# intentionally NOT redirected.
[[redirects]]
  from = "/camp-info"
  to = "/summer-2027.html"
  status = 301
  force = true

[[redirects]]
  from = "/camp-info.html"
  to = "/summer-2027.html"
  status = 301
  force = true

# Shrek Jr. closed in July 2026 and its page is gone. Old links, shared
# posts, and search results go to the current season rather than a 404.
[[redirects]]
  from = "/shrek"
  to = "/index.html#shows"
  status = 301
  force = true

[[redirects]]
  from = "/shrek.html"
  to = "/index.html#shows"
  status = 301
  force = true

# Every Sawyer and Regpack embed is gone (Jul 31 2026) — registration,
# coaching, and auditions all run through our own system now. These pages
# are deleted but still indexed (Todd's Jul 30 audit), so send them to the
# real checkout rather than letting them 404.
#
# /coaching-registration was the Regpack coaching form.
[[redirects]]
  from = "/coaching-registration"
  to = "/register/?coaching"
  status = 301
  force = true

[[redirects]]
  from = "/coaching-registration.html"
  to = "/register/?coaching"
  status = 301
  force = true

# /novapa_registration was the Sawyer schedule embed.
[[redirects]]
  from = "/novapa_registration"
  to = "/register/"
  status = 301
  force = true

[[redirects]]
  from = "/novapa_registration.html"
  to = "/register/"
  status = 301
  force = true
